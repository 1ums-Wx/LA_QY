<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋爱契约 (极简版)</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #ffeef8; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3); width: 360px; text-align: center; }
        h2 { color: #ff6b81; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #ffe0e6; border-radius: 10px; outline: none; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ff6b81; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; }
        button:hover { background: #ff4766; }
        .msg { margin-top: 15px; color: #ff4766; font-weight: bold; min-height: 20px;}
    </style>
</head>
<body>

<div class="card">
    <h2>恋爱契约</h2>
    
    <!-- 注册/生成邀请码 -->
    <div id="register-section">
        <input type="text" id="username" placeholder="输入你的昵称">
        <button onclick="register()">生成我的邀请码</button>
    </div>

    <!-- 签订契约 -->
    <div id="contract-section" style="display: none;">
        <p style="color:#888;">你的邀请码: <b id="my-code" style="color:#ff4766;"></b></p>
        <input type="text" id="partner-code" placeholder="输入 TA 的邀请码">
        <button onclick="signContract()">确认签订契约 💍</button>
    </div>

    <div id="msg" class="msg"></div>
</div>

<!-- ⚠️ 注意：你需要把下面这两个值换成你自己的 Supabase 配置 -->
<script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // 1. 初始化 Supabase (请替换成你自己的 URL 和 KEY)
    const supabaseUrl = '你的_SUPABASE_URL';
    const supabaseKey = '你的_SUPABASE_ANON_KEY';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // 2. 注册并生成邀请码
    window.register = async function() {
        const username = document.getElementById('username').value.trim();
        const msgEl = document.getElementById('msg');
        if (!username) { msgEl.innerText = '请输入昵称哦！'; return; }

        // 随机生成一个邀请码
        const code = 'LOVE-' + Math.floor(Math.random() * 9000 + 1000);
        
        // 存入 Supabase 数据库
        const { error } = await supabase.from('users').insert([{ username, invite_code: code }]);
        
        if (error) {
            msgEl.innerText = '注册失败: ' + error.message;
        } else {
            // 切换页面，显示邀请码
            document.getElementById('my-code').innerText = code;
            document.getElementById('register-section').style.display = 'none';
            document.getElementById('contract-section').style.display = 'block';
            msgEl.innerText = '生成成功！快去发给 TA 吧~';
        }
    };

    // 3. 签订契约
    window.signContract = async function() {
        const partnerCode = document.getElementById('partner-code').value.trim();
        const myCode = document.getElementById('my-code').innerText;
        const msgEl = document.getElementById('msg');

        if (!partnerCode) { msgEl.innerText = '请输入 TA 的邀请码'; return; }

        // 去数据库查对方的邀请码
        const { data, error } = await supabase.from('users').select('id').eq('invite_code', partnerCode).single();

        if (error || !data) {
            msgEl.innerText = '邀请码无效，请检查！';
            return;
        }

        // 更新自己的数据库，绑定对方的ID
        const { error: updateError } = await supabase.from('users').update({ partner_id: data.id }).eq('invite_code', myCode);

        if (updateError) {
            msgEl.innerText = '签订失败: ' + updateError.message;
        } else {
            msgEl.innerText = '🎉 契约达成！祝你们永远甜蜜！';
        }
    };
</script>
</body>
</html>
